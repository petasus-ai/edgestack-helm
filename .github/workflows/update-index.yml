name: Update Index

# Brings each channel's index.yaml in line with its charts: master (stable, append-only)
# and dev (0.0.0-dev only); see .github/scripts/update-index.py. Every run compares the
# whole branch with its index, so a push whose run was cancelled is caught by the next
# one, and the hourly run catches anything left over. Both branches carry this file and
# the script; keep the copies the same.
on:
  push:
    branches: [master, dev]
    paths:
      - '**.tgz'
      - '.github/unguarded.txt'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  index:
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(github.event_name == 'push' && format('["{0}"]', github.ref_name) || '["master","dev"]') }}
    concurrency:
      group: index-${{ matrix.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Reconcile the index, commit and push
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          pip install -q pyyaml
          git config user.email "edgestack-bot@users.noreply.github.com"
          git config user.name "edgestack-bot"
          status=0
          # A chart pushed meanwhile moves the branch: start again from its new head.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            set +e
            python3 .github/scripts/update-index.py
            status=$?
            set -e
            git add -A
            if git diff --cached --quiet; then
              echo "index.yaml is current"
              break
            fi
            git commit -q -m "Update chart index"
            if git push -q origin "HEAD:$BRANCH"; then
              break
            fi
            sleep $((attempt * 3))
          done
          exit $status
