  dranet:
  - apiVersion: v2
    appVersion: v1.0.1
    created: "2026-08-03T07:38:54.146568057Z"
    description: DraNet — a DRA (Dynamic Resource Allocation) netdev driver. Its DaemonSet
      publishes host network devices (SR-IOV VFs, RDMA) as DRA ResourceSlices and,
      at claim time, moves the netdev (with its IP, routes and RDMA char devices)
      into the pod network namespace. Ships the "dranet" DeviceClass. Requires containerd
      2.x with NRI + CDI enabled on the nodes.
