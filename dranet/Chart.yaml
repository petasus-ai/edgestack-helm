apiVersion: v2
name: dranet
description: >-
  DraNet — a DRA (Dynamic Resource Allocation) netdev driver. Its DaemonSet
  publishes host network devices (SR-IOV VFs, RDMA) as DRA ResourceSlices and,
  at claim time, moves the netdev (with its IP, routes and RDMA char devices)
  into the pod network namespace. Ships the "dranet" DeviceClass. Requires
  containerd 2.x with NRI + CDI enabled on the nodes.
type: application
version: 1.0.1
appVersion: "v1.0.1"
home: https://github.com/google/dranet
sources:
  - https://github.com/google/dranet
keywords:
  - dra
  - sriov
  - rdma
  - networking
maintainers:
  - name: Petasus
