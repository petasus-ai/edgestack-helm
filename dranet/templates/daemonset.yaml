# Mirrors the DaemonSet from google/dranet v1.0.1 install.yaml, with the image and
# tolerations parameterized. The upstream `enable-nri` initContainer (which rewrites
# /etc/containerd/config.toml and restarts containerd) is intentionally omitted: our
# node images ship containerd 2.x with NRI enabled by default, and its v2-style config
# append would neither apply cleanly to a v3 config nor warrant a containerd restart.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dranet
  namespace: {{ .Release.Namespace }}
  labels:
    tier: node
    app: dranet
    k8s-app: dranet
spec:
  selector:
    matchLabels:
      app: dranet
  template:
    metadata:
      labels:
        tier: node
        app: dranet
        k8s-app: dranet
    spec:
      hostNetwork: true
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      serviceAccountName: dranet
      containers:
      - name: dranet
        args:
        - /dranet
        - --v={{ .Values.verbosity }}
        - --hostname-override=$(NODE_NAME)
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
{{ toYaml .Values.resources | indent 10 }}
        securityContext:
          privileged: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9177
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/plugins
        - name: plugin-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: nri-plugin
          mountPath: /var/run/nri
        - name: netns
          mountPath: /var/run/netns
          mountPropagation: HostToContainer
        - name: infiniband
          mountPath: /dev/infiniband
          mountPropagation: HostToContainer
        - name: bpf-programs
          mountPath: /sys/fs/bpf
          mountPropagation: HostToContainer
      volumes:
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/plugins
      - name: plugin-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
      - name: nri-plugin
        hostPath:
          path: /var/run/nri
      - name: netns
        hostPath:
          path: /var/run/netns
      - name: infiniband
        hostPath:
          path: /dev/infiniband
      - name: bpf-programs
        hostPath:
          path: /sys/fs/bpf
